<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辰途智科 - 企业官网与CMS解决方案</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="brand">
                <span class="brand-logo">辰</span>
                <span>辰途智科</span>
            </a>
            <div class="nav-links">
                <a href="/" class="active">首页</a>
                <a href="/news">新闻动态</a>
                <a href="/login">后台登录</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 公司简介 Hero -->
        <section class="hero">
            <h1>辰途智科</h1>
            <p>{{ company_intro }}</p>
        </section>

        <!-- 最新新闻 -->
        <section>
            <div class="section-header">
                <h2 class="section-title">最新动态</h2>
                <a href="/news" class="section-more">查看全部 →</a>
            </div>

            {% if top3_news %}
            <div class="news-grid">
                {% for n in top3_news %}
                <a href="/news/{{ n.id }}" class="news-card">
                    <div class="news-card-title">{{ n.title }}</div>
                    <div class="news-card-content">{{ n.content }}</div>
                    <div class="news-card-meta">
                        <span class="tag tag-{{ n.category }}">{{ n.category }}</span>
                        <span>{{ n.created_at }}</span>
                    </div>
                </a>
                {% endfor %}
            </div>
            {% else %}
            <div class="empty-state">
                <div class="empty-state-icon">📄</div>
                <p>暂无新闻动态</p>
            </div>
            {% endif %}
        </section>
    </div>

    <footer class="footer">
        © 2026 辰途智科 · 企业官网定制与CMS内容管理系统
    </footer>
</body>
</html>
