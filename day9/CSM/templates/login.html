<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 辰途智科</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="brand">
                <span class="brand-logo">辰</span>
                <span>辰途智科</span>
            </a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/news">新闻动态</a>
                <a href="/login" class="active">后台登录</a>
            </div>
        </div>
    </nav>

    <div class="container-narrow">
        <div class="form-card">
            <h1 class="form-title">后台登录</h1>
            <p class="form-subtitle">请使用管理员账号登录以管理新闻内容</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登录</button>
                </div>
            </form>

            <div style="margin-top: 20px; padding: 14px; background: var(--primary-light); border-radius: 8px; font-size: 13px; color: var(--primary-dark);">
                <strong>测试账号：</strong> admin / admin123
            </div>
        </div>
    </div>

    <footer class="footer">
        © 2026 辰途智科 · 企业官网定制与CMS内容管理系统
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                showToast('请填写用户名和密码', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const json = await res.json();

                if (res.status === 200 && json.code === 200) {
                    showToast('登录成功，正在跳转...', 'success');
                    setTimeout(() => { window.location.href = '/admin'; }, 600);
                } else {
                    showToast(json.msg || json.message || '登录失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '登录';
                }
            } catch (err) {
                showToast('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '登录';
            }
        });

        function showToast(msg, type) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
