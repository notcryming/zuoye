[pytest]
# 测试文件目录
testpaths = tests

# 测试文件/类/函数命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项：详细模式 + 短回溯
addopts = -v --tb=short

# 忽略非测试目录（模型文件、前端静态、实例数据库）
norecursedirs = app .git instance data 运行截图 项目文档说明

# 警告过滤
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
